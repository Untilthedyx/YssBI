[package]
name = "yss-ui"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/ui.rs"

[dependencies]
anyhow = "1"
bigdecimal = "0.4.10"
gpui-kit.workspace = true
hex.workspace = true
lru.workspace = true
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
tree-sitter-r = "=1.3.0"
arborium-julia = "=2.18.2"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
url.workspace = true
open = "5.4.1"
yss-canonical-hash = { path = "../yss-canonical-hash" }
yss-data-contract = { path = "../yss-data-contract" }
yss-filesystem = { path = "../yss-filesystem" }
yss-i18n = { path = "../yss-i18n" }
yss-settings = { path = "../yss-settings" }

[dev-dependencies]
markdown = "=1.0.0"
uuid.workspace = true

[build-dependencies]
rust-i18n-support = { version = "=4.2.4", features = ["codegen"] }
